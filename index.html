<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roguelike</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111317;
      color: #f4f1e8;
      cursor: url("Assets/Icons/MovementIcon.png") 4 3, auto;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #111317;
    }

    #game {
      position: fixed;
      inset: 0;
      cursor: inherit;
    }

    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 7;
      width: min(290px, calc(100vw - 32px));
      pointer-events: none;
    }

    .panel {
      border: 1px solid rgba(244, 241, 232, 0.16);
      border-radius: 8px;
      background: rgba(17, 19, 23, 0.72);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(10px);
    }

    .boss-health {
      position: fixed;
      top: 16px;
      left: 50%;
      z-index: 9;
      width: min(560px, calc(100vw - 380px));
      min-width: 320px;
      padding: 10px 14px 12px;
      border: 1px solid rgba(255, 76, 76, 0.36);
      border-radius: 8px;
      background: rgba(17, 19, 23, 0.78);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .boss-health[hidden] {
      display: none;
    }

    .boss-health__header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 7px;
      font-size: 13px;
      line-height: 1.1;
      color: rgba(244, 241, 232, 0.78);
    }

    .boss-health__name {
      color: #fff1f1;
      font-size: 18px;
      font-weight: 900;
    }

    .boss-health__value {
      white-space: nowrap;
      font-weight: 800;
    }

    .boss-health__bar {
      position: relative;
      height: 16px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 76, 76, 0.16);
      box-shadow: inset 0 0 0 1px rgba(255, 76, 76, 0.2);
    }

    .boss-health__bar span {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #9c1024, #ff3448);
      transition: width 180ms ease;
    }

    .quick-use-bar {
      position: fixed;
      left: 50%;
      bottom: calc(80px + env(safe-area-inset-bottom));
      z-index: 8;
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      width: min(380px, calc(100vw - 32px));
      transform: translateX(-50%);
      pointer-events: auto;
    }

    .quick-use-button {
      position: relative;
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      padding: 8px;
      border: 1px solid rgba(244, 241, 232, 0.2);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(34, 38, 46, 0.9), rgba(15, 17, 21, 0.9));
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.34), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      color: #f4f1e8;
      cursor: inherit;
      touch-action: manipulation;
    }

    .quick-use-button[hidden] {
      display: none;
    }

    .quick-use-button img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      pointer-events: none;
    }

    .quick-use-key {
      position: absolute;
      top: 4px;
      left: 4px;
      display: grid;
      place-items: center;
      min-width: 20px;
      height: 20px;
      border: 1px solid rgba(244, 241, 232, 0.28);
      border-radius: 5px;
      background: rgba(7, 8, 10, 0.82);
      color: #f8e9b4;
      font-size: 8px;
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
    }

    .quick-use-button:active:not(:disabled) {
      transform: translateY(1px) scale(0.98);
    }

    .quick-use-button:disabled,
    .quick-use-button.is-empty {
      opacity: 0.45;
      filter: grayscale(0.45);
    }

    .quick-use-count {
      position: absolute;
      right: 4px;
      bottom: 4px;
      min-width: 22px;
      padding: 2px 5px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.68);
      color: #f4f1e8;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      text-align: center;
      pointer-events: none;
    }

    .quick-use-count.is-max {
      color: #ff6b6b;
    }

    .quick-use-count[hidden],
    .quick-use-button img[hidden] {
      display: none;
    }

    .ability-slot-wrap {
      position: fixed;
      left: 50%;
      bottom: calc(80px + env(safe-area-inset-bottom));
      z-index: 8;
      display: flex;
      justify-content: flex-end;
      width: min(380px, calc(100vw - 32px));
      transform: translateX(-50%);
      pointer-events: auto;
    }

    .ability-slot {
      position: relative;
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      padding: 8px;
      overflow: hidden;
      border: 1px solid rgba(158, 220, 255, 0.26);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(31, 46, 58, 0.9), rgba(12, 17, 23, 0.92));
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.34), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      color: #f4f1e8;
      cursor: inherit;
      touch-action: manipulation;
    }

    .ability-slot.is-empty {
      opacity: 0.45;
      filter: grayscale(0.45);
    }

    .ability-slot__image {
      position: relative;
      z-index: 1;
      width: 38px;
      height: 38px;
      object-fit: contain;
      pointer-events: none;
      transition: filter 120ms ease, opacity 120ms ease;
    }

    .ability-slot.is-cooling .ability-slot__image {
      filter: brightness(0.36) saturate(0.7);
    }

    .ability-slot__image[hidden] {
      display: none;
    }

    .ability-slot__key {
      position: absolute;
      top: 4px;
      left: 4px;
      z-index: 3;
      display: grid;
      place-items: center;
      min-width: 34px;
      height: 20px;
      padding: 0 5px;
      border: 1px solid rgba(244, 241, 232, 0.28);
      border-radius: 5px;
      background: rgba(7, 8, 10, 0.82);
      color: #bfeaff;
      font-size: 8px;
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
    }

    .ability-slot__cooldown {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      height: 0%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.74), rgba(196, 236, 255, 0.48));
      mix-blend-mode: screen;
      opacity: 0;
      pointer-events: none;
      transition: height 80ms linear, opacity 120ms ease;
    }

    .ability-slot.is-cooling .ability-slot__cooldown {
      opacity: 0.9;
    }

    .ability-slot.is-ready-flash {
      animation: abilityReadyFlash 360ms ease-out;
    }

    @keyframes abilityReadyFlash {
      0% {
        box-shadow: 0 0 0 rgba(255, 255, 255, 0), 0 12px 28px rgba(0, 0, 0, 0.34);
      }

      38% {
        border-color: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 24px rgba(255, 255, 255, 0.85), 0 12px 28px rgba(0, 0, 0, 0.34);
      }

      100% {
        box-shadow: 0 0 0 rgba(255, 255, 255, 0), 0 12px 28px rgba(0, 0, 0, 0.34);
      }
    }

    .stat-highlight {
      animation: statPulseRed 3s ease-in-out;
    }

    @keyframes statPulseRed {
      0%,
      100% {
        color: inherit;
      }

      12%,
      36%,
      60%,
      84% {
        color: #ff4c4c;
      }

      24%,
      48%,
      72% {
        color: #f4f1e8;
      }
    }

    .bar {
      position: relative;
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(244, 241, 232, 0.14);
    }

    .bar span {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #56c271, #d9c35f);
      transition: width 160ms ease;
    }

    .log-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 16px;
      gap: 7px;
      align-items: stretch;
      padding: 9px 10px;
      pointer-events: auto;
    }

    .log {
      min-height: 78px;
      max-height: 78px;
      overflow: hidden;
      font-size: 13px;
      line-height: 1.35;
    }

    .log p {
      margin: 0 0 6px;
      color: rgba(244, 241, 232, 0.82);
    }

    .log p:first-child {
      color: #f4f1e8;
    }

    .log-slider {
      width: 16px;
      height: 78px;
      accent-color: #f0b35a;
      cursor: pointer;
      direction: rtl;
      writing-mode: vertical-rl;
    }

    .log-slider[hidden] {
      display: none;
    }

    .gold-chip {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 8;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 7px 11px;
      border: 1px solid rgba(244, 201, 91, 0.32);
      border-radius: 8px;
      background: rgba(17, 19, 23, 0.76);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(10px);
      color: #f4f1e8;
      font-size: 14px;
      font-weight: 800;
      pointer-events: none;
    }

    .coin-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 1px solid rgba(255, 239, 163, 0.78);
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 30%, #fff6b8 0 13%, transparent 14%),
        linear-gradient(135deg, #ffd95b, #c8871b);
      box-shadow: inset 0 -2px 0 rgba(120, 70, 0, 0.34), 0 0 10px rgba(240, 179, 90, 0.22);
      flex: 0 0 auto;
    }

    .player-status {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 8;
      width: min(380px, calc(100vw - 32px));
      padding: 10px 12px 12px;
      border: 1px solid rgba(86, 194, 113, 0.28);
      border-radius: 8px;
      background: rgba(17, 19, 23, 0.78);
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(10px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .player-status__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      color: rgba(244, 241, 232, 0.78);
      font-size: 13px;
      line-height: 1.1;
    }

    .player-status__label {
      color: #f4f1e8;
      font-weight: 900;
    }

    .defeat-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: rgba(143, 0, 20, 0.58);
      pointer-events: auto;
    }

    .victory-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: rgba(26, 91, 61, 0.62);
      pointer-events: auto;
    }

    .defeat-overlay[hidden] {
      display: none;
    }

    .victory-overlay[hidden] {
      display: none;
    }

    .defeat-overlay__text {
      color: #fff1f1;
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }

    .victory-overlay__text {
      color: #f2ffe9;
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }

    .shop-confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 26;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(17, 19, 23, 0.64);
      pointer-events: auto;
    }

    .shop-confirm-dialog {
      width: min(360px, calc(100vw - 36px));
      padding: 18px;
      border: 1px solid rgba(244, 241, 232, 0.22);
      border-radius: 8px;
      background: rgba(25, 28, 33, 0.96);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.42);
      text-align: center;
    }

    .shop-confirm-dialog h2 {
      margin: 0 0 8px;
      color: #f4f1e8;
      font-size: 20px;
      letter-spacing: 0;
    }

    .shop-confirm-dialog p {
      margin: 0 0 16px;
      color: rgba(244, 241, 232, 0.84);
      font-size: 15px;
      line-height: 1.35;
    }

    .shop-confirm-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .shop-confirm-actions button {
      min-width: 104px;
      min-height: 38px;
      border: 1px solid rgba(244, 241, 232, 0.22);
      border-radius: 8px;
      background: rgba(244, 241, 232, 0.12);
      color: #f4f1e8;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .shop-confirm-actions button:focus-visible {
      outline: 2px solid #f0b35a;
      outline-offset: 2px;
    }

    .shop-confirm-actions [data-shop-confirm="yes"] {
      background: #56c271;
      border-color: #56c271;
      color: #111317;
    }

    .item-tooltip {
      position: fixed;
      z-index: 24;
      display: grid;
      gap: 4px;
      max-width: 230px;
      padding: 9px 11px;
      border: 1px solid rgba(244, 241, 232, 0.18);
      border-radius: 8px;
      background: rgba(17, 19, 23, 0.9);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.34);
      color: #f4f1e8;
      font-size: 13px;
      line-height: 1.25;
      pointer-events: none;
      transform: translateZ(0);
    }

    .item-tooltip[hidden] {
      display: none;
    }

    .item-tooltip span {
      color: rgba(244, 241, 232, 0.78);
    }

    .epic-reward-overlay {
      position: fixed;
      inset: 0;
      z-index: 28;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(17, 19, 23, 0.68);
      pointer-events: auto;
    }

    .epic-reward-overlay[hidden] {
      display: none;
    }

    .epic-reward-dialog {
      position: relative;
      width: min(620px, calc(100vw - 36px));
      padding: 18px;
      border: 1px solid rgba(244, 241, 232, 0.22);
      border-radius: 8px;
      background: rgba(25, 28, 33, 0.96);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.42);
    }

    .epic-reward-close {
      position: absolute;
      top: 10px;
      right: 10px;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid rgba(244, 241, 232, 0.2);
      border-radius: 8px;
      background: rgba(244, 241, 232, 0.08);
      color: #f4f1e8;
      font: inherit;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .epic-reward-close:hover,
    .epic-reward-close:focus-visible {
      border-color: rgba(240, 179, 90, 0.86);
      outline: none;
    }

    .epic-reward-dialog h2 {
      margin: 0 0 14px;
      padding: 0 38px;
      color: #f4f1e8;
      font-size: 20px;
      letter-spacing: 0;
      text-align: center;
    }

    .epic-reward-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .epic-reward-card {
      display: grid;
      justify-items: center;
      gap: 8px;
      min-height: 168px;
      padding: 14px 10px;
      border: 1px solid rgba(244, 241, 232, 0.2);
      border-radius: 8px;
      background: rgba(244, 241, 232, 0.08);
      color: #f4f1e8;
      font: inherit;
      cursor: pointer;
      text-align: center;
    }

    .epic-reward-card.is-epic {
      border-color: rgba(180, 117, 255, 0.72);
      box-shadow: inset 0 0 0 1px rgba(180, 117, 255, 0.22);
    }

    .epic-reward-card img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      pointer-events: none;
    }

    .epic-reward-card strong {
      font-size: 15px;
      line-height: 1.15;
    }

    .epic-reward-card span {
      color: rgba(244, 241, 232, 0.78);
      font-size: 12px;
      line-height: 1.3;
    }

    .epic-reward-card:focus-visible {
      outline: 2px solid #f0b35a;
      outline-offset: 2px;
    }

    @media (max-width: 900px) {
      .boss-health {
        left: auto;
        right: 16px;
        width: min(420px, calc(100vw - 380px));
        min-width: 260px;
        transform: none;
      }
    }

    @media (max-width: 640px) {
      .hud {
        top: calc(8px + env(safe-area-inset-top));
        left: calc(8px + env(safe-area-inset-left));
        width: min(260px, calc(100vw - 16px));
      }

      .bar {
        height: 10px;
      }

      .boss-health {
        top: calc(8px + env(safe-area-inset-top));
        left: auto;
        right: calc(8px + env(safe-area-inset-right));
        width: min(310px, calc(100vw - 292px));
        min-width: 190px;
        padding: 8px 10px 9px;
        transform: none;
      }

      .boss-health__header {
        gap: 8px;
        margin-bottom: 5px;
        font-size: 11px;
      }

      .boss-health__name {
        font-size: 14px;
      }

      .boss-health__bar {
        height: 11px;
      }

      .log {
        min-height: 48px;
        max-height: 68px;
        font-size: 11px;
        line-height: 1.25;
      }

      .log p {
        margin-bottom: 3px;
      }

      .defeat-overlay__text {
        font-size: 44px;
      }

      .quick-use-bar {
        bottom: calc(100px + env(safe-area-inset-bottom));
        gap: 10px;
        width: min(330px, calc(100vw - 16px));
      }

      .quick-use-button {
        width: 54px;
        height: 54px;
        padding: 7px;
      }

      .quick-use-button img {
        width: 34px;
        height: 34px;
      }

      .ability-slot-wrap {
        bottom: calc(100px + env(safe-area-inset-bottom));
        width: min(330px, calc(100vw - 16px));
      }

      .ability-slot {
        width: 54px;
        height: 54px;
        padding: 7px;
      }

      .ability-slot__image {
        width: 34px;
        height: 34px;
      }

      .ability-slot__key {
        min-width: 32px;
        height: 18px;
        font-size: 10px;
      }

      .quick-use-count {
        right: 3px;
        bottom: 3px;
        min-width: 20px;
        padding: 2px 4px;
        font-size: 11px;
      }

      .log-panel {
        grid-template-columns: minmax(0, 1fr) 14px;
      }

      .log-slider {
        width: 14px;
        height: 68px;
      }

      .gold-chip {
        top: calc(8px + env(safe-area-inset-top));
        right: calc(8px + env(safe-area-inset-right));
        min-height: 32px;
        padding: 6px 9px;
        font-size: 12px;
      }

      .player-status {
        bottom: calc(12px + env(safe-area-inset-bottom));
        width: min(330px, calc(100vw - 16px));
        padding: 8px 10px 10px;
      }

      .player-status__header {
        margin-bottom: 5px;
        font-size: 12px;
      }
    }

    @media (max-width: 420px) {
      .hud {
        top: calc(6px + env(safe-area-inset-top));
        left: calc(6px + env(safe-area-inset-left));
        width: min(246px, calc(100vw - 12px));
      }

      .log {
        min-height: 42px;
        max-height: 58px;
        font-size: 10px;
      }

      .quick-use-button {
        width: 54px;
        height: 54px;
      }

      .quick-use-button img {
        width: 35px;
        height: 35px;
      }

      .ability-slot {
        width: 54px;
        height: 54px;
      }

      .ability-slot__image {
        width: 35px;
        height: 35px;
      }

      .boss-health {
        top: calc(88px + env(safe-area-inset-top));
        left: calc(6px + env(safe-area-inset-left));
        right: calc(6px + env(safe-area-inset-right));
        width: auto;
        min-width: 0;
      }
    }

    @media (max-height: 560px) and (max-width: 900px) {
      .hud {
        width: min(246px, calc(100vw - 12px));
      }

      .log {
        min-height: 0;
        max-height: 42px;
        font-size: 10px;
      }

      .quick-use-button {
        width: 50px;
        height: 50px;
      }

      .quick-use-button img {
        width: 34px;
        height: 34px;
      }

      .ability-slot {
        width: 50px;
        height: 50px;
      }

      .ability-slot__image {
        width: 34px;
        height: 34px;
      }

      .epic-reward-options {
        grid-template-columns: 1fr;
      }

      .epic-reward-card {
        min-height: 112px;
      }
    }
  </style>
</head>
<body>
  <main id="game" aria-label="3D roguelike minigame"></main>

  <section class="hud" aria-live="polite">
    <div class="panel log-panel">
      <div class="log" id="log"></div>
      <input class="log-slider" id="logSlider" type="range" min="0" max="0" value="0" aria-label="Log history" hidden>
    </div>
  </section>

  <div class="gold-chip" aria-live="polite">
    <span>Gold:</span>
    <span class="coin-icon" aria-hidden="true"></span>
    <strong id="goldText">0</strong>
  </div>

  <section class="player-status" aria-live="polite">
    <div class="player-status__header">
      <strong class="player-status__label">Energy</strong>
      <span id="hpText">100 / 100 HP</span>
    </div>
    <div class="bar" aria-hidden="true"><span id="hpBar"></span></div>
  </section>

  <section class="boss-health" id="bossHealth" aria-live="polite" hidden>
    <div class="boss-health__header">
      <strong class="boss-health__name" id="bossName"></strong>
      <span class="boss-health__value" id="bossHpText"></span>
    </div>
    <div class="boss-health__bar" aria-hidden="true"><span id="bossHpBar"></span></div>
  </section>

  <div class="quick-use-bar" id="quickUseBar" aria-label="Consumable quick use"></div>

  <div class="ability-slot-wrap" aria-label="Ability quick use">
    <button class="ability-slot is-empty" id="abilitySlot" type="button" aria-label="Space: ability empty" aria-disabled="true" tabindex="-1">
      <span class="ability-slot__key">Space</span>
      <img class="ability-slot__image" id="abilitySlotImage" alt="" aria-hidden="true" hidden>
      <span class="ability-slot__cooldown" id="abilitySlotCooldown" aria-hidden="true"></span>
    </button>
  </div>

  <div class="item-tooltip" id="itemTooltip" hidden></div>

  <div class="epic-reward-overlay" id="epicRewardOverlay" role="dialog" aria-modal="true" aria-labelledby="epicRewardTitle" hidden>
    <div class="epic-reward-dialog">
      <button class="epic-reward-close" type="button" data-epic-reward-close aria-label="Close reward choices">&times;</button>
      <h2 id="epicRewardTitle">Choose one reward</h2>
      <div class="epic-reward-options" id="epicRewardOptions"></div>
    </div>
  </div>

  <div class="defeat-overlay" id="defeatOverlay" role="status" aria-live="assertive" hidden>
    <div class="defeat-overlay__text">DEFEATED</div>
  </div>

  <div class="victory-overlay" id="victoryOverlay" role="status" aria-live="assertive" hidden>
    <div class="victory-overlay__text">COMPLETED</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
